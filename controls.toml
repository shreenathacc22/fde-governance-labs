# Which governance controls are switched on.
# Everything starts off. Each lab turns one on.
#
# To ignore this file for one test run:
#   pytest --controls=off    everything off (the starter agent)
#   pytest --controls=on     everything on

approvals = true      # Lab 1: irreversible tools wait for a human yes/no
scoped_access = true  # Lab 2: the agent can only touch the signed-in customer's record
traces = true         # Lab 3: every step is written to traces/<run>.jsonl
rollback = true       # Lab 4: release history, one-command rollback, kill switch
